<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reproductor - LatamTv</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css?v=6">
  <link rel="stylesheet" href="css/stream.css?v=6">
</head>
<body class="player-page">

  <nav class="navbar stream-nav">
    <div class="navbar-inner">
      <a href="javascript:history.back()" class="nav-link" id="back-btn" style="gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Volver
      </a>
      <a href="index.html" class="brand">Latam<span class="dot">Tv</span></a>
      <span id="user-chip" class="hidden" style="font-size:14px;font-weight:500;color:var(--text-secondary);padding:8px 4px;"></span>
      <a href="login.html" id="login-btn" class="btn btn-primary btn-sm">Iniciar Sesion</a>
      <a href="login.html" id="logout-btn" class="btn btn-secondary btn-sm hidden">Cerrar Sesion</a>
    </div>
  </nav>

  <main class="container" style="padding-top:32px;padding-bottom:80px;max-width:1100px;">
    <div id="player" style="margin-bottom:16px;"></div>
    <div id="player-error-line" style="display:none;text-align:center;padding:30px;border:1px solid var(--border);border-radius:18px;background:var(--bg-card);">
      <h3 style="font-family:var(--font-display);font-size:20px;margin-bottom:10px;">No se pudo reproducir</h3>
      <p id="player-error-text" style="color:var(--text-secondary);font-size:14px;line-height:1.6;"></p>
    </div>
    <p style="text-align:center;color:var(--text-muted);font-size:12px;">Si el video no funciona, puede estar caido o el formato no es compatible con tu navegador.</p>
  </main>

  <!-- Floating register prompt -->
  <div id="reg-prompt" class="reg-prompt">
    <div class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><circle cx="10" cy="13" r="0.5" fill="currentColor"/></svg>
    </div>
    <div class="msg">
      <h4>Registrate para seguir viendo</h4>
      <p>Crea una cuenta gratis y disfruta del contenido sin interrupciones.</p>
    </div>
    <div class="actions">
      <a href="login.html" class="btn btn-primary">Registrarse</a>
      <button id="reg-dismiss" class="btn btn-secondary">Seguir viendo</button>
    </div>
  </div>

  <script type="module">
    import { onAuthChange, auth, logout } from './js/auth.js?v=7';
    import { initPlayer } from './js/player.js?v=7';

    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('src') || '';
    const title = params.get('title') || 'Reproduccion';
    const tag = params.get('tag') || '';

    let currentUser = null;
    onAuthChange((user) => {
      currentUser = user;
      const chip = document.getElementById('user-chip');
      const loginBtn = document.getElementById('login-btn');
      const logoutBtn = document.getElementById('logout-btn');
      if (user) {
        chip.textContent = user.displayName || user.email.split('@')[0];
        chip.classList.remove('hidden');
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
      } else {
        chip.classList.add('hidden');
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
      }
    });
    document.getElementById('logout-btn').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    let promptShown = false;
    function handlePlaybackStart() {
      if (currentUser || promptShown) return;
      setTimeout(() => {
        if (currentUser || promptShown) return;
        promptShown = true;
        document.getElementById('reg-prompt').classList.add('show');
      }, 30000);
    }
    document.getElementById('reg-dismiss').addEventListener('click', () => {
      document.getElementById('reg-prompt').classList.remove('show');
    });

    window.__ltvOnPlaying = handlePlaybackStart;
    document.title = title + ' - LatamTv';

    if (!streamUrl) {
      document.getElementById('reg-prompt').remove && document.getElementById('reg-prompt').remove();
      document.getElementById('player').innerHTML = '<div class="empty-block" style="border:1px solid var(--border);border-radius:18px;background:var(--bg-card);"><h3>Sin link</h3><p>Este elemento no tiene URL de video.</p></div>';
    } else {
      initPlayer(document.getElementById('player'), { streamUrl, title, tag });
    }
  </script>

</body>
</html>
