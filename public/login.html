<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Iniciar Sesion - AppForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css?v=6">
  <link rel="stylesheet" href="css/builder.css?v=1">
  <link rel="stylesheet" href="css/stream.css?v=1">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="box">A</div>
        <span>AppForge</span>
      </div>
      <h1>Bienvenido</h1>
      <p>Inicia sesion con tu cuenta de Google para crear tus apps.</p>

      <button id="google-btn" class="btn btn-google btn-lg" style="width:100%;">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84A6.6 6.6 0 0 1 12 5.38z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="auth-divider"><span>o</span></div>
      <a href="create.html" class="btn btn-secondary" style="width:100%;">Ir a crear una app</a>
      <p id="error" class="hidden" style="margin-top:16px;color:var(--error);font-size:13px;"></p>
      <div id="loading" class="loading-spinner hidden"></div>
    </div>
  </div>

  <script type="module">
    import { signInGoogle, onAuthChange, ensureUserDoc } from './js/auth.js?v=1';
    import { showToast } from './js/util.js?v=1';

    document.getElementById('google-btn').addEventListener('click', async () => {
      const btn = document.getElementById('google-btn');
      const loading = document.getElementById('loading');
      btn.disabled = true;
      loading.classList.remove('hidden');
      try {
        const res = await signInGoogle();
        await ensureUserDoc(res.user);
        const redirect = localStorage.getItem('af-redirect');
        localStorage.removeItem('af-redirect');
        window.location.href = redirect || 'dashboard.html';
      } catch (e) {
        btn.disabled = false;
        loading.classList.add('hidden');
        showToast('Error al iniciar sesion: ' + e.message, 'error');
      }
    });

    onAuthChange((user) => {
      if (user) {
        const redirect = localStorage.getItem('af-redirect');
        localStorage.removeItem('af-redirect');
        window.location.href = redirect || 'dashboard.html';
      }
    });
  </script>
</body>
</html>
