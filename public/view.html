<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>App - AppForge</title>
  <link rel="stylesheet" href="css/custom.css?v=7">
  <link rel="stylesheet" href="css/stream.css?v=1">
  <link rel="stylesheet" href="css/builder.css?v=12">
<script type="module">
    (async () => {
      const params = new URLSearchParams(location.search);
      const appId = params.get('id');
      try {
        const { initAppPage } = await import('./js/appview.js?v=4');
        initAppPage(appId);
      } catch (e) {
        console.error(e);
        document.getElementById('v-root').innerHTML = '<div class="v-error">Error al cargar la app.<br><a href="index.html">Ir a AppForge</a></div>';
      }
      window.__fcmStatus = (s) => fcmBadge(s);
    })();

    function fcmBadge(msg) {
      let el = document.getElementById('fcm-badge');
      if (!el) {
        el = document.createElement('div');
        el.id = 'fcm-badge';
        el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:300;' +
          'background:#0d0d10;border:1px solid #333;color:#eee;border-radius:10px;padding:8px 14px;' +
          'font:12px/1.4 sans-serif;display:flex;gap:8px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5);';
        document.body.appendChild(el);
      }
      const ok = /ok|registrado|perm-ok/i.test(msg);
      const warn = /iniciando/i.test(msg);
      const span = document.createElement('span');
      span.textContent = 'FCM: ' + msg;
      span.style.color = ok ? '#4ade80' : (warn ? '#fbbf24' : '#f87171');
      const close = document.createElement('span');
      close.textContent = '×';
      close.style.cssText = 'cursor:pointer;opacity:.6;font-size:14px;margin-left:4px;';
      close.onclick = () => el.remove();
      el.innerHTML = '';
      el.appendChild(span);
      el.appendChild(close);
    }
  </script>
</head>
<body>
  <div id="v-root"></div>
  <div class="v-install" id="v-install" style="display:none;">
    <div class="v-install-inner">
      <img id="v-install-icon" alt="">
      <div style="flex:1;min-width:0;">
        <div class="v-install-name" id="v-install-name"></div>
        <div class="v-install-sub" id="v-install-sub"></div>
      </div>
      <button class="btn btn-primary btn-sm" id="v-install-btn">Instalar</button>
    </div>
  </div>
</body>
</html>
