  <script type="module">
    import { onAuthChange, auth, logout } from './js/auth.js?v=2';
    import { escapeHtml } from './js/util.js?v=1';

onAuthChange((user) => {
      const wrap = document.getElementById('profile-wrap');
      const drop = document.getElementById('profile-drop');
      const loginBtn = document.getElementById('login-btn');
      const heroCta = document.getElementById('hero-cta');
      const setAccount = (name, email, avatar) => {
        document.getElementById('accountName').textContent = name;
        document.getElementById('accountEmail').textContent = email;
        document.getElementById('accountAvatar').src = avatar || '';
        document.getElementById('miniAvatar').src = avatar || '';
      };
      document.getElementById('li-login').classList.toggle('hidden', !!user);
      document.getElementById('li-apps').classList.toggle('hidden', !user);
      document.getElementById('li-logout').classList.toggle('hidden', !user);
      document.getElementById('accountLink').href = user ? 'dashboard.html' : 'login.html';
      if (user) {
        if (wrap) { document.getElementById('profile-avatar').src = user.photoURL || ''; document.getElementById('profile-name').textContent = user.displayName || ''; document.getElementById('profile-email').textContent = user.email || ''; }
        if (loginBtn) loginBtn.classList.add('hidden');
        if (wrap) { wrap.classList.remove('hidden'); drop.classList.add('hidden'); }
        setAccount(user.displayName || 'Mi cuenta', user.email || '', user.photoURL || '');
        if (heroCta) { heroCta.href = 'dashboard.html'; heroCta.textContent = 'Ver mis apps'; }
      } else {
        if (wrap) wrap.classList.add('hidden');
        if (loginBtn) loginBtn.classList.remove('hidden');
        setAccount('Invitado', 'Conectate con tu cuenta', '');
        if (heroCta) { heroCta.href = 'create.html'; heroCta.textContent = 'Crear mi app gratis'; }
      }
    });

    const glassWrap = document.getElementById('glassWrap');
    document.getElementById('toggle').addEventListener('click', () => glassWrap.classList.toggle('open'));
    const hp = document.getElementById('hero-plans');
    if (hp) hp.addEventListener('click', (e) => { e.preventDefault(); openWin('planes'); });

    // Navegacion: abre/cierra ventanas flotantes (modo sin scroll)
    const WIN_MAP = { inicio: 'inicio', 'como-funciona': 'como', planes: 'planes', info: 'inicio' };
    const openWin = (target) => {
      glassWrap.classList.remove('open'); // cierra el menu
      const id = WIN_MAP[target] || target;
      if (window.Glass) window.Glass.open(id);
      else if (id) { document.querySelectorAll('.gwin').forEach(w => w.classList.toggle('open', w.getAttribute('data-win') === id)); }
    };
    const go = (goto) => {
      if (goto === 'login') { window.location.href = 'login.html'; return; }
      if (goto === 'dashboard') { window.location.href = 'dashboard.html'; return; }
      if (goto && (goto === 'inicio' || goto === 'como-funciona' || goto === 'planes' || goto === 'info')) { openWin(goto); return; }
      const elv = document.getElementById(goto);
      if (elv) window.Glass && window.Glass.open(goto);
    };

    document.querySelectorAll('.glass-menu li[data-goto]').forEach((li) => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.glass-menu li[data-goto]').forEach((x) => x.classList.remove('current'));
        li.classList.add('current');
        go(li.dataset.goto);
      });
    });
    document.querySelectorAll('.mini-menu li[data-target]').forEach((li) => {
      li.addEventListener('click', () => {
        document.querySelectorAll('.mini-menu li').forEach((x) => x.classList.remove('active'));
        li.classList.add('active');
        openWin(li.dataset.target);
      });
    });
    document.getElementById('li-logout').addEventListener('click', () => logout());

    if (document.getElementById('profile-btn')) document.getElementById('profile-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('profile-drop').classList.toggle('hidden');
    });
    document.addEventListener('click', () => { const d = document.getElementById('profile-drop'); if (d) d.classList.add('hidden'); });
    if (document.getElementById('logout-btn')) document.getElementById('logout-btn').addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      logout();
    });
  </script>
