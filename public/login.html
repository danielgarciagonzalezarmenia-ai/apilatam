<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Iniciar Sesion - AppForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css?v=7">
  <link rel="stylesheet" href="css/builder.css?v=2">
  <link rel="stylesheet" href="css/stream.css?v=1">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="box">A</div>
        <span>AppForge</span>
      </div>
      <h1>Bienvenido</h1>
      <p>Inicia sesion para crear tus apps.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="email">Correo</button>
        <button class="auth-tab" data-tab="google">Google</button>
      </div>

      <div id="tab-email">
        <form id="email-form" autocomplete="on">
          <div class="form-group" id="name-field" style="display:none;">
            <label class="field-label">Nombre</label>
            <input type="text" id="f-name" class="input" placeholder="Tu nombre">
          </div>
          <div class="form-group">
            <label class="field-label">Correo electronico</label>
            <input type="email" id="f-email" class="input" placeholder="tucorreo@ejemplo.com" required>
          </div>
          <div class="form-group" id="pass-field">
            <label class="field-label">Contrasena</label>
            <input type="password" id="f-pass" class="input" placeholder="Minimo 6 caracteres" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="email-submit">Iniciar sesion</button>
        </form>
        <div class="auth-meta">
          <button type="button" id="btn-reset" class="auth-link">Olvide mi contrasena</button>
          <button type="button" id="btn-toggle-mode" class="auth-link">No tengo cuenta, registrarme</button>
        </div>
      </div>

      <div id="tab-google" style="display:none;">
        <button id="google-btn" class="btn btn-google btn-lg" style="width:100%;">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.43.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84A6.6 6.6 0 0 1 12 5.38z"/>
          </svg>
          Continuar con Google
        </button>
      </div>

      <div class="auth-divider"><span>o</span></div>
      <a href="create.html" class="btn btn-secondary" style="width:100%;">Ir a crear una app</a>
      <p id="error" class="hidden" style="margin-top:16px;color:var(--error);font-size:13px;"></p>
      <div id="loading" class="loading-spinner hidden"></div>
    </div>
  </div>

  <script type="module">
    import { signInGoogle, onAuthChange, ensureUserDoc, signInEmail, signUpEmail, sendReset } from './js/auth.js?v=2';
    import { showToast } from './js/util.js?v=1';

    const $ = id => document.getElementById(id);
    let registerMode = false;

    function go(redirect) {
      localStorage.removeItem('af-redirect');
      window.location.href = redirect || 'dashboard.html';
    }

    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const isEmail = tab.dataset.tab === 'email';
        $('tab-email').style.display = isEmail ? '' : 'none';
        $('tab-google').style.display = isEmail ? 'none' : '';
      });
    });

    $('btn-toggle-mode').addEventListener('click', () => {
      registerMode = !registerMode;
      $('name-field').style.display = registerMode ? '' : 'none';
      $('email-submit').textContent = registerMode ? 'Crear cuenta' : 'Iniciar sesion';
      $('btn-toggle-mode').textContent = registerMode ? 'Ya tengo cuenta, iniciar sesion' : 'No tengo cuenta, registrarme';
      $('error').classList.add('hidden');
    });

    $('btn-reset').addEventListener('click', async () => {
      const email = $('f-email').value.trim();
      if (!email) return showToast('Escribe tu correo primero', 'error');
      $('btn-reset').disabled = true;
      try {
        await sendReset(email);
        showToast('Te enviamos un enlace para restablecer tu contrasena', 'success');
      } catch (e) {
        showToast(mapErr(e.code), 'error');
      }
      $('btn-reset').disabled = false;
    });

    $('email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('f-email').value.trim();
      const pass = $('f-pass').value;
      const name = $('f-name').value.trim();
      const btn = $('email-submit');
      const loading = $('loading');
      btn.disabled = true;
      loading.classList.remove('hidden');
      try {
        if (registerMode) {
          if (!name) throw { code: 'auth/incomplete-name' };
          await signUpEmail(email, pass, name);
        }
        await signInEmail(email, pass);
        go(localStorage.getItem('af-redirect'));
      } catch (err) {
        showToast(mapErr(err.code), 'error');
        btn.disabled = false;
        loading.classList.add('hidden');
      }
    });

    $('google-btn').addEventListener('click', async () => {
      const btn = $('google-btn');
      const loading = $('loading');
      btn.disabled = true;
      loading.classList.remove('hidden');
      try {
        const res = await signInGoogle();
        await ensureUserDoc(res.user);
        go(localStorage.getItem('af-redirect'));
      } catch (e) {
        btn.disabled = false;
        loading.classList.add('hidden');
        showToast('Error al iniciar sesion: ' + mapErr(e.code), 'error');
      }
    });

    function mapErr(code) {
      return {
        'auth/user-not-found': 'No existe una cuenta con ese correo',
        'auth/wrong-password': 'Contrasena incorrecta',
        'auth/invalid-credential': 'Correo o contrasena incorrectos',
        'auth/invalid-email': 'Correo invalido',
        'auth/email-already-in-use': 'Ya hay una cuenta con ese correo',
        'auth/weak-password': 'La contrasena debe tener al menos 6 caracteres',
        'auth/too-many-requests': 'Demasiados intentos. Espera un momento',
        'auth/incomplete-name': 'Escribe tu nombre',
        'auth/user-disabled': 'Esta cuenta esta deshabilitada',
        'auth/network-request-failed': 'Sin conexion. Revisa tu internet',
        'auth/popup-closed-by-user': 'Ventana de Google cerrada'
      }[code] || 'Error: revisa tus datos';
    }

    onAuthChange((user) => {
      if (user) go(localStorage.getItem('af-redirect'));
    });
  </script>
</body>
</html>
