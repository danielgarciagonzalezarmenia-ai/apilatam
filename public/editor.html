<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Editor - AppForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css?v=8">
  <link rel="stylesheet" href="css/builder.css?v=5">
  <link rel="stylesheet" href="css/stream.css?v=1">
</head>
<body class="editor">

  <div class="editor-top">
    <div class="editor-top-inner">
      <div class="app-mini">
        <div id="mini-logo" class="fallback">A</div>
        <div class="name" id="mini-name">Sin nombre</div>
      </div>
      <button class="btn btn-secondary btn-sm" id="btn-preview">Ver app</button>
      <button class="btn btn-secondary btn-sm" id="btn-save">Guardar</button>
      <button class="btn btn-primary btn-sm" id="btn-download">Descargar App</button>
      <a href="dashboard.html" class="btn btn-secondary btn-sm">Panel</a>
      <div id="profile-wrap" class="profile-wrap"></div>
    </div>
  </div>

  <div class="pages-bar">
    <span class="pages-label">Paginas</span>
    <div class="pages-chips" id="pages-chips"></div>
    <button class="btn btn-secondary btn-sm" id="btn-add-page" style="flex-shrink:0;">+ Pagina</button>
  </div>

  <div class="editor-layout">
    <aside class="editor-panel">
      <div class="panel-title">Agregar bloques a esta pagina</div>
      <div class="block-palette" id="palette"></div>
      <div class="panel-title" style="margin-top:28px;">Estructura <span style="text-transform:none;font-weight:500;letter-spacing:0;">(arrastra para reordenar)</span></div>
      <div class="block-list" id="block-list" style="margin-top:6px;"></div>
    </aside>

    <section class="preview-wrap">
      <div class="phone-box">
        <div class="phone-frame">
          <div class="phone-notch"></div>
          <div class="phone-statusbar">
            <span id="sb-time">9:41</span>
            <span style="letter-spacing:1px;">&#128246;&#128268;&#128267;</span>
          </div>
          <div class="phone-screen" id="phone-screen"></div>
        </div>
      </div>
    </section>

    <aside class="editor-panel">
      <div class="panel-title" id="insp-title">Inspector</div>
      <div id="inspector"></div>
    </aside>
  </div>

  <div id="dl-overlay" class="modal-overlay" style="display:none">
    <div class="modal" style="max-width:440px;">
      <h2>Descargar app</h2>
      <div class="dl-grid">
        <div class="qr-box"><div id="qr-loading" class="loading-spinner" style="margin:0;"></div><img id="qr-img" alt="Codigo QR" class="hidden"></div>
        <p style="font-size:14px;color:var(--text-secondary);">
          <strong style="color:var(--text-primary);">Instala en tu telefono</strong><br>
          Escanea el codigo o abre el enlace. Desde ahi podras instalarla como una app en tu celular.
        </p>
        <div class="dl-url" id="dl-url"></div>
        <div class="dl-actions">
          <a class="btn btn-primary" id="btn-open-app" target="_blank">Abrir app</a>
          <button class="btn btn-secondary" id="btn-copy-url">Copiar URL</button>
          <button class="btn btn-secondary" id="dl-close">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { doc, getDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import { db, onAuthChange } from './js/auth.js?v=3';
    import { showToast, escapeHtml, uid, copyText } from './js/util.js?v=1';
    import { BLOCK_TYPES, defaultTheme, renderBlocks, defaultBlocks, FONTS, loadFont, initHls } from './js/blocks.js?v=4';
    import { setupProfile } from './js/profile.js?v=1';

    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const appId = params.get('id');
    let currentUser = null;
    let appData = null;
    let pages = [];
    let currentPageId = null;
    let previewPageId = null;
    let theme = defaultTheme();
    let selectedId = null;
    let dirty = false;
    let saveTimer = null;

    if (!appId) { window.location.href = 'dashboard.html'; }

    onAuthChange(async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      setupProfile($('profile-wrap'), user, { onSaved: () => showToast('Perfil actualizado', 'success') });
      await load();
    });

    async function load() {
      const snap = await getDoc(doc(db, 'apps', appId));
      if (!snap.exists()) { window.location.href = 'dashboard.html'; return; }
      appData = snap.data();
      if (appData.ownerId !== currentUser.uid) { window.location.href = 'dashboard.html'; return; }
      theme = { ...defaultTheme(), ...(appData.theme || {}) };
      pages = normalizePages(appData);
      pages.forEach(p => migrateLinks(p.blocks));
      $('mini-name').textContent = appData.name || 'Sin nombre';
      updateMiniApp();
      selectPage(pages[0].id);
      renderPalette();
      setupFont();
    }

    function normalizePages(d) {
      let pgs = d.pages && d.pages.length ? JSON.parse(JSON.stringify(d.pages)) : null;
      if (!pgs) {
        pgs = [{
          id: 'p' + uid(),
          name: 'Inicio',
          blocks: (d.blocks && d.blocks.length) ? JSON.parse(JSON.stringify(d.blocks)) : defaultBlocks()
        }];
      }
      return pgs.map(p => ({ ...p, blocks: (p.blocks && p.blocks.length) ? p.blocks : [] }));
    }

    function migrateLinks(list) {
      (list || []).forEach(b => {
        if (b.type === 'button' && !b.linkTarget && !b.linkUrl && b.url && b.url !== '#') {
          b.linkUrl = b.url;
        }
      });
    }

    function curBlocks() {
      const p = pages.find(p => p.id === currentPageId) || pages[0];
      return p ? p.blocks : [];
    }

    function getPage(id) {
      return pages.find(p => p.id === id);
    }

    /* ---------- Fonts ---------- */
    function setupFont() {
      if (!theme.font) return;
      loadFont(theme.font, () => {
        if (currentPageId) renderPreview();
      });
    }

    /* ---------- Pages ---------- */
    function renderChips() {
      const chips = $('pages-chips');
      chips.innerHTML = pages.map(p => `
        <div class="page-chip ${p.id === currentPageId ? 'active' : ''}" data-page="${p.id}">
          <span class="pc-name">${escapeHtml(p.name)}</span>
          <button class="pc-btn" data-rename="${p.id}" title="Renombrar">${ICON_EDIT}</button>
          <button class="pc-btn danger" data-del="${p.id}" title="Eliminar">${ICONS_X}</button>
        </div>`).join('');
      chips.querySelectorAll('[data-page]').forEach(c => c.addEventListener('click', (e) => {
        if (e.target.closest('[data-rename],[data-del]')) return;
        selectPage(c.dataset.page);
      }));
      chips.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => delPage(b.dataset.del)));
      chips.querySelectorAll('[data-rename]').forEach(b => b.addEventListener('click', () => renamePage(b.dataset.rename)));
    }

    function selectPage(id) {
      currentPageId = id;
      previewPageId = id;
      selectedId = null;
      renderChips();
      renderList();
      renderInspector();
      renderPreview();
    }

    $('btn-add-page').addEventListener('click', addPage);

    function addPage() {
      const n = pages.length + 1;
      const header = newBlock('header');
      header.text = 'Pagina ' + n;
      header.subtitle = '';
      const text = newBlock('text');
      text.text = 'Escribe aqui el contenido de la pagina ' + n + '.';
      const p = { id: 'p' + uid(), name: 'Pagina ' + n, blocks: [header, text] };
      pages.push(p);
      currentPageId = p.id;
      previewPageId = p.id;
      selectedId = null;
      renderChips();
      renderList();
      renderInspector();
      renderPreview();
      markDirty();
      showToast('Pagina creada: ' + p.name, 'success');
    }

    function renamePage(id) {
      const p = getPage(id);
      if (!p) return;
      const chip = document.querySelector(`[data-page="${id}"] .pc-name`);
      if (!chip) return;
      const inp = document.createElement('input');
      inp.className = 'input';
      inp.value = p.name;
      inp.maxLength = 30;
      inp.style.padding = '4px 8px';
      inp.style.fontSize = '13px';
      inp.style.width = '130px';
      chip.replaceWith(inp);
      inp.focus();
      inp.select();
      const commit = () => {
        const v = inp.value.trim();
        if (v && v !== p.name) { p.name = v; markDirty(); }
        renderChips();
      };
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') renderChips();
      });
      inp.addEventListener('blur', commit);
    }

    function delPage(id) {
      if (pages.length <= 1) return showToast('Debe quedar al menos una pagina', 'error');
      const p = getPage(id);
      if (!p) return;
      if (!confirm('Eliminar la pagina "' + p.name + '"? Sus bloques se eliminaran.')) return;
      pages.splice(pages.indexOf(p), 1);
      pages.forEach(pg => pg.blocks.forEach(b => {
        if ((b.linkTarget || '') === id) { b.linkTarget = ''; b.linkUrl = ''; }
        (b.items || []).forEach(it => {
          if ((it.linkTarget || '') === id) { it.linkTarget = ''; it.linkUrl = ''; }
        });
      }));
      if (currentPageId === id || previewPageId === id) {
        currentPageId = pages[0].id;
        previewPageId = currentPageId;
        selectedId = null;
      }
      renderChips();
      renderList();
      renderInspector();
      renderPreview();
      markDirty();
      showToast('Pagina eliminada', 'error');
    }

    /* ---------- Palette ---------- */
    const ICONS = {
      header: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
      heading: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v16M18 4v16M6 12h12"/></svg>',
      text: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="m4 19 5-5 4 4 3-3 4 4"/></svg>',
      button: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/></svg>',
      video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>',
      youtube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18v12H3z"/><path d="m10 9 5 3-5 3z"/></svg>',
      html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 6-5 6 5 6M16 6l5 6-5 6M13 5l-2 14"/></svg>',
      list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
      divider: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/></svg>',
      spacer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6V2M8 6H4M16 6V2M16 6h4M8 18v4M8 18H4M16 18v4M16 18h4M4 8v8M20 8v8"/></svg>',
      footer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15h16M6 18h12"/></svg>'
    };
    const PALETTE = [
      { type: 'header', label: 'Encabezado' },
      { type: 'heading', label: 'Titulo' },
      { type: 'text', label: 'Texto' },
      { type: 'image', label: 'Imagen' },
      { type: 'button', label: 'Boton' },
      { type: 'video', label: 'Video MP4' },
      { type: 'youtube', label: 'YouTube' },
      { type: 'html', label: 'HTML' },
      { type: 'list', label: 'Lista' },
      { type: 'divider', label: 'Divisor' },
      { type: 'spacer', label: 'Espacio' },
      { type: 'footer', label: 'Pie' }
    ];

    function renderPalette() {
      const el = $('palette');
      el.innerHTML = PALETTE.map(p => `
        <button class="palette-btn" data-add="${p.type}">
          ${ICONS[p.type] || ''}
          <span>${p.label}</span>
        </button>`).join('');
      el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => addBlock(b.dataset.add)));
    }

    function newBlock(type) {
      const b = { id: 'b' + uid(), type };
      switch (type) {
        case 'header': b.text = 'Mi App'; b.subtitle = 'Subtitulo'; b.showLogo = true; b.logo = ''; b.align = 'center'; break;
        case 'heading': b.text = 'Nuevo titulo'; b.align = 'left'; b.size = 26; break;
        case 'text': b.text = 'Escribe aqui tu texto.'; b.align = 'left'; b.size = 15; b.opacity = 0.85; break;
        case 'image': b.url = ''; b.align = 'center'; b.width = 100; break;
        case 'button': b.text = 'Boton'; b.url = '#'; b.variant = 'solid'; b.align = 'center'; b.bg = ''; b.textColor = ''; b.width = ''; b.height = ''; b.linkTarget = ''; b.linkUrl = ''; break;
        case 'video': b.type = 'video'; b.url = ''; break;
        case 'youtube': b.type = 'youtube'; b.url = ''; break;
        case 'html': b.html = '<p style="margin:0;">Mi <strong>bloque</strong> HTML.</p>'; break;
        case 'list': b.items = [{ icon: '\u2713', text: 'Elemento 1', desc: '' }, { icon: '\u2713', text: 'Elemento 2', desc: '' }]; break;
        case 'divider': break;
        case 'spacer': b.height = 24; break;
        case 'footer': b.text = 'AppForge \u00A9 2026'; break;
      }
      return b;
    }

    function addBlock(type) {
      const b = newBlock(type);
      curBlocks().push(b);
      renderList();
      selectBlock(b.id);
      renderPreview();
      markDirty();
    }

    /* ---------- Block list (drag & drop) ---------- */
    const ICON_EDIT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    const ICONS_X = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    const HANDLE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

    let dragId = null;
    function renderList() {
      const el = $('block-list');
      const bl = curBlocks();
      if (!bl.length) {
        el.innerHTML = '<p class="empty-inspector" style="padding:14px 8px;">Aun no hay bloques. Haz clic en uno de arriba para agregarlo.</p>';
        return;
      }
      el.innerHTML = bl.map(b => `
        <div class="block-row ${b.id === selectedId ? 'selected' : ''}" data-id="${b.id}" draggable="true">
          <span class="drag-handle">${HANDLE}</span>
          <span class="btype">${BLOCK_TYPES[b.type] || b.type}</span>
          <div class="btools">
            <button class="del" data-del="${b.id}" title="Eliminar" draggable="false">${ICONS_X}</button>
          </div>
        </div>`).join('');

      el.querySelectorAll('.block-row[data-id]').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('[data-del]')) return;
          selectBlock(row.dataset.id);
        });
        row.addEventListener('dragstart', (e) => {
          dragId = row.dataset.id;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', dragId);
          requestAnimationFrame(() => row.classList.add('dragging'));
        });
        row.addEventListener('dragend', () => {
          dragId = null;
          row.classList.remove('dragging');
          el.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
        });
        row.addEventListener('dragenter', (e) => {
          e.preventDefault();
          if (row.dataset.id === dragId) return;
          el.querySelectorAll('.drop-target').forEach(x => x.classList.remove('drop-target'));
          row.classList.add('drop-target');
        });
        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        row.addEventListener('drop', (e) => {
          e.preventDefault();
          const arr = curBlocks();
          const from = arr.findIndex(b => b.id === dragId);
          const to = arr.findIndex(b => b.id === row.dataset.id);
          if (from < 0 || to < 0 || from === to) return;
          const [moved] = arr.splice(from, 1);
          const newTo = arr.findIndex(b => b.id === row.dataset.id);
          arr.splice(newTo < 0 ? Math.min(from, arr.length) : newTo, 0, moved);
          dragId = null;
          renderList();
          renderPreview();
          markDirty();
        });
      });
      el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => removeBlock(b.dataset.del)));
    }

    function removeBlock(id) {
      const arr = curBlocks();
      const i = arr.findIndex(b => b.id === id);
      if (i < 0) return;
      arr.splice(i, 1);
      if (selectedId === id) selectBlock(null);
      renderList();
      renderPreview();
      markDirty();
    }

    /* ---------- Selection & inspector ---------- */
    function selectBlock(id) {
      selectedId = id;
      renderList();
      renderInspector();
    }

    function field(label, inputHtml) {
      return `<div class="inspector-field"><label>${label}</label>${inputHtml}</div>`;
    }
    function input(k, v, opts = {}) {
      const type = opts.type || 'text';
      return `<input type="${type}" class="input" data-k="${k}" value="${escapeHtml(v)}" ${opts.ph ? `placeholder="${opts.ph}"` : ''}>`;
    }
    function sel(k, v, options) {
      return `<select class="select" data-k="${k}">${options.map(o => `<option value="${o}" ${String(v) === String(o) ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    }
    function textarea(k, v, rows = 3) {
      return `<textarea class="input" data-k="${k}" rows="${rows}">${escapeHtml(v)}</textarea>`;
    }
    function colorField(k, v) {
      return `<div class="color-row"><input type="color" data-k="${k}" value="${escapeHtml(v)}" style="width:44px;height:34px;"><input class="input" data-k="${k}" value="${escapeHtml(v)}" style="flex:1;"></div>`;
    }
    function rangeField(k, v, min, max) {
      const cur = Number(v) || 0;
      return `<div class="range-row"><input type="range" data-r="${k}" min="${min}" max="${max}" step="1" value="${cur}"><span class="range-val" data-rv="${k}">${cur ? cur + 'px' : 'Auto'}</span></div>`;
    }

    function pageLinkFields(b, label = 'Enlace') {
      const opts = `<option value="">Sin enlace</option>` + pages.map(p =>
        `<option value="${escapeHtml(p.id)}" ${b.linkTarget === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
      return `
        <div class="inspector-field"><label>${label}: pagina de la app</label><select class="select" data-linktarget>${opts}</select></div>
        <div class="inspector-field"><label>${label}: URL externa (opcional)</label><input class="input" data-linkurl placeholder="https://ejemplo.com" value="${escapeHtml(b.linkUrl || '')}"></div>`;
    }

    function renderInspector() {
      const el = $('inspector');
      const block = curBlocks().find(b => b.id === selectedId);
      if (!block) {
        $('insp-title').textContent = 'App (tema global)';
        el.innerHTML = `
          ${field('Nombre de la app', `<input class="input" data-app-name value="${escapeHtml(appData.name || '')}">`)}
          ${field('Version', `<input class="input" data-app-version value="${escapeHtml(appData.version || '')}">`)}
          ${field('Descripcion', `<textarea class="input" data-app-desc rows="3">${escapeHtml(appData.description || '')}</textarea>`)}
          ${field('Logo (URL)', `<input class="input" data-app-logo value="${escapeHtml(appData.logoUrl || '')}">`)}
          <div class="inspector-field" style="margin-top:6px;"><label>Tema de la app</label></div>
          ${field('Tipografia', sel('font', theme.font, FONTS))}
          ${field('Color de fondo', colorField('bg', theme.bg))}
          ${field('Color de texto', colorField('text', theme.text))}
          ${field('Color de acento', colorField('accent', theme.accent))}
          ${field('Esquinas (radius)', input('radius', theme.radius, { type: 'number', ph: '16' }))}
          <div class="inspector-field"><label>Modo</label><div class="seg">
            <button data-theme-mode="dark" class="${theme.dark ? 'active' : ''}">Oscuro</button>
            <button data-theme-mode="light" class="${!theme.dark ? 'active' : ''}">Claro</button>
          </div></div>
          <p class="empty-inspector" style="margin-top:18px;">Haz clic en un bloque para editar su contenido, colores y enlaces.</p>`;
        el.querySelectorAll('[data-theme-mode]').forEach(b => b.addEventListener('click', () => setDark(b.dataset.themeMode === 'dark')));
      } else {
        $('insp-title').textContent = BLOCK_TYPES[block.type] || 'Bloque';
        el.innerHTML = inspectorFor(block);
      }
      bindInspector(el, block);
    }

    function inspectorFor(b) {
      switch (b.type) {
        case 'header': return field('Titulo', input('text', b.text)) + field('Subtitulo', input('subtitle', b.subtitle)) + field('Alineacion', sel('align', b.align, ['center','left','right'])) + `<div class="inspector-field"><label><input type="checkbox" data-k="showLogo" ${b.showLogo ? 'checked' : ''}> Mostrar logo</label></div>` + field('Logo (URL)', input('logo', b.logo));
        case 'heading': return field('Texto', input('text', b.text)) + field('Tamaño', input('size', b.size, { type: 'number' })) + field('Alineacion', sel('align', b.align, ['left','center','right']));
        case 'text': return field('Texto', textarea('text', b.text, 5)) + field('Tamaño', input('size', b.size, { type: 'number' })) + field('Alineacion', sel('align', b.align, ['left','center','right']));
        case 'image': return field('URL de imagen', input('url', b.url)) + field('Alineacion', sel('align', b.align, ['center','left','right'])) + field('Ancho %', input('width', b.width, { type: 'number' })) + pageLinkFields(b, 'Al hacer clic en la imagen');
        case 'button': return field('Texto', input('text', b.text)) + field('Estilo', sel('variant', b.variant, ['solid','outline','ghost'])) + field('Alineacion', sel('align', b.align, ['center','left','right'])) + `<div class="field-row">${field('Ancho', rangeField('width', b.width, 60, 375))}${field('Altura', rangeField('height', b.height, 36, 220))}</div>` + field('Color del boton', colorField('bg', b.bg || theme.accent)) + field('Color del texto', colorField('textColor', b.textColor || (b.variant === 'solid' ? '#000000' : theme.accent))) + pageLinkFields(b, 'Al hacer clic en el boton');
        case 'video':
        case 'youtube': return field('URL del video', input('url', b.url, { ph: b.type === 'youtube' ? 'https://youtube.com/watch?v=...' : 'https://...mp4' }));
        case 'html': return field('Codigo HTML', textarea('html', b.html, 8));
        case 'list': return `
          <div class="inspector-field"><label>Elementos</label></div>
          ${(b.items || []).map((it, i) => `
            <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
              <input class="input" data-item-icon="${i}" value="${escapeHtml(it.icon || '')}" style="width:52px;text-align:center;" placeholder="Icono">
              <input class="input" data-item-text="${i}" value="${escapeHtml(it.text || '')}" placeholder="Texto">
              <button class="btn btn-danger btn-sm" data-item-del="${i}" style="padding:7px 9px;">${ICONS_X}</button>
            </div>
            <input class="input" data-item-desc="${i}" value="${escapeHtml(it.desc || '')}" placeholder="Descripcion (opcional)" style="margin-bottom:8px;">
            <div class="item-link-row">
              <select class="select" data-item-target="${i}">
                <option value="">Sin enlace</option>
                ${pages.map(p => `<option value="${escapeHtml(p.id)}" ${it.linkTarget === p.id ? 'selected' : ''}>${escapeHtml(p.name)}</option>`).join('')}
              </select>
              <input class="input" data-item-url="${i}" value="${escapeHtml(it.linkUrl || '')}" placeholder="URL externa (opcional)">
            </div>`).join('')}
          <button class="btn btn-secondary btn-sm" id="list-add" style="width:100%;margin-top:12px;">+ Agregar elemento</button>`;
        case 'divider': return '<p class="empty-inspector">Bloque divisor. No tiene opciones.</p>';
        case 'spacer': return field('Altura (px)', input('height', b.height, { type: 'number' }));
        case 'footer': return field('Texto', input('text', b.text));
        default: return '<p class="empty-inspector">Sin opciones.</p>';
      }
    }

    function bindInspector(el, block) {
      if (block) {
        el.querySelectorAll('[data-k]').forEach(inp => {
          const k = inp.dataset.k;
          const evt = inp.type === 'checkbox' ? 'change' : 'input';
          inp.addEventListener(evt, () => {
            let val = inp.value;
            if (inp.type === 'checkbox') val = inp.checked;
            else if (inp.type === 'number') val = Number(val);
            block[k] = val;
            if (inp.type === 'color') {
              el.querySelectorAll(`input[data-k="${k}"]`).forEach(x => { if (x !== inp && x.type === 'text') x.value = val; });
            } else if (inp.type === 'text' && /^#/.test(String(val))) {
              el.querySelectorAll(`input[data-k="${k}"]`).forEach(x => { if (x !== inp && x.type === 'color') x.value = val; });
            }
            renderPreview();
            markDirty();
          });
        });

        const lt = el.querySelector('[data-linktarget]');
        if (lt) {
          lt.addEventListener('change', () => {
            block.linkTarget = lt.value || '';
            renderPreview();
            markDirty();
          });
        }
        const lu = el.querySelector('[data-linkurl]');
        if (lu) {
          lu.addEventListener('input', () => {
            block.linkUrl = lu.value;
            renderPreview();
            markDirty();
          });
        }

        el.querySelectorAll('[data-r]').forEach(r => {
          const k = r.dataset.r;
          const lbl = el.querySelector(`[data-rv="${k}"]`);
          r.addEventListener('input', () => {
            block[k] = Number(r.value) || '';
            if (lbl) lbl.textContent = block[k] ? block[k] + 'px' : 'Auto';
            renderPreview();
            markDirty();
          });
        });

        el.querySelectorAll('[data-item-text]').forEach(inp => {
          inp.addEventListener('input', () => {
            block.items[+inp.dataset.itemText].text = inp.value;
            renderPreview(); markDirty();
          });
        });
        el.querySelectorAll('[data-item-desc]').forEach(inp => {
          inp.addEventListener('input', () => {
            block.items[+inp.dataset.itemDesc].desc = inp.value;
            renderPreview(); markDirty();
          });
        });
        el.querySelectorAll('[data-item-icon]').forEach(inp => {
          inp.addEventListener('input', () => {
            block.items[+inp.dataset.itemIcon].icon = inp.value;
            renderPreview(); markDirty();
          });
        });
        el.querySelectorAll('[data-item-target]').forEach(inp => {
          inp.addEventListener('change', () => {
            block.items[+inp.dataset.itemTarget].linkTarget = inp.value || '';
            renderPreview(); markDirty();
          });
        });
        el.querySelectorAll('[data-item-url]').forEach(inp => {
          inp.addEventListener('input', () => {
            block.items[+inp.dataset.itemUrl].linkUrl = inp.value;
            renderPreview(); markDirty();
          });
        });
        el.querySelectorAll('[data-item-del]').forEach(btn => {
          btn.addEventListener('click', () => {
            block.items.splice(+btn.dataset.itemDel, 1);
            renderInspector(); renderPreview(); markDirty();
          });
        });
        const addBtn = el.querySelector('#list-add');
        if (addBtn) addBtn.addEventListener('click', () => {
          block.items = block.items || [];
          block.items.push({ icon: '\u2713', text: 'Nuevo elemento', desc: '' });
          renderInspector(); renderPreview(); markDirty();
        });
      } else {
        el.querySelectorAll('[data-k]').forEach(inp => {
          const k = inp.dataset.k;
          inp.addEventListener('input', () => {
            let val = inp.value;
            if (inp.type === 'number') val = Number(val);
            theme[k] = val;
            if (inp.type === 'color') {
              el.querySelectorAll(`input[data-k="${k}"]`).forEach(x => { if (x !== inp && x.type === 'text') x.value = val; });
            } else if (inp.type === 'text' && /^#/.test(String(val))) {
              el.querySelectorAll(`input[data-k="${k}"]`).forEach(x => { if (x !== inp && x.type === 'color') x.value = val; });
            }
            if (k === 'font') loadFont(theme.font, () => renderPreview());
            renderPreview();
            markDirty();
          });
        });

        el.querySelectorAll('[data-app-name],[data-app-version],[data-app-desc],[data-app-logo]').forEach(inp => {
          inp.addEventListener('input', () => {
            if (inp.dataset.appName) appData.name = inp.value.trim();
            else if (inp.dataset.appVersion) appData.version = inp.value.trim();
            else if (inp.dataset.appDesc) appData.description = inp.value.trim();
            else appData.logoUrl = inp.value.trim();
            updateMiniApp();
            markDirty();
          });
        });
      }
    }

    /* ---------- App mini ---------- */
    function updateMiniApp() {
      $('mini-name').textContent = appData.name || 'Sin nombre';
      const ml = $('mini-logo');
      if (appData.logoUrl) {
        ml.innerHTML = `<img src="${escapeHtml(appData.logoUrl)}" alt="">`;
        ml.classList.remove('fallback');
      } else {
        ml.textContent = (appData.name || 'A')[0].toUpperCase();
        ml.classList.add('fallback');
      }
    }

    function setDark(dark) {
      theme.dark = dark;
      if (dark) { theme.bg = '#0a0a0a'; theme.text = '#fafafa'; }
      else { theme.bg = '#ffffff'; theme.text = '#111111'; }
      renderInspector();
      renderPreview();
      markDirty();
    }

    /* ---------- Preview ---------- */
    function renderPreview() {
      const screen = $('phone-screen');
      const t = { ...theme };
      const pg = getPage(previewPageId) || pages[0];
      const inner = renderBlocks(pg.blocks, t);
      screen.innerHTML = `<div class="ab-phone-root" style="--t-font:${t.font},system-ui,sans-serif;--t-bg:${t.bg};--t-text:${t.text};--t-accent:${t.accent};--t-radius:${t.radius}px;">${inner}</div>`;
      screen.style.background = t.bg;
      $('sb-time').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      screen.querySelectorAll('[data-af-page]').forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault();
        const target = getPage(a.dataset.afPage);
        if (target) { previewPageId = target.id; renderPreview(); }
      }));
      initHls(screen);
      fitPhone();
    }

    function fitPhone() {
      if (window.matchMedia('(max-width: 1100px)').matches) return;
      const wrap = document.querySelector('.preview-wrap');
      const box = document.querySelector('.phone-box');
      if (!wrap || !box) return;
      const scale = Math.min(1, (wrap.clientWidth - 48) / 375, (wrap.clientHeight - 48) / 715);
      box.style.transform = 'scale(' + Math.max(0.1, scale) + ')';
    }
    window.addEventListener('resize', fitPhone);

    /* ---------- Save ---------- */
    function markDirty() {
      dirty = true;
      scheduleSave();
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(save, 800);
    }

    async function save() {
      if (!appId || !currentUser || !appData) return;
      try {
        await updateDoc(doc(db, 'apps', appId), {
          name: (appData.name || '').trim() || 'Sin nombre',
          version: (appData.version || '').trim() || '1.0.0',
          description: (appData.description || '').trim(),
          logoUrl: (appData.logoUrl || '').trim(),
          pages: JSON.parse(JSON.stringify(pages)),
          blocks: JSON.parse(JSON.stringify(pages[0].blocks || [])),
          theme: JSON.parse(JSON.stringify(theme)),
          updatedAt: serverTimestamp(),
          published: true
        });
        appData.name = (appData.name || '').trim() || 'Sin nombre';
        appData.version = (appData.version || '').trim() || '1.0.0';
        updateMiniApp();
        dirty = false;
      } catch (e) {
        console.error('save error', e);
      }
    }

    $('btn-save').addEventListener('click', async () => {
      await save();
      showToast('Cambios guardados', 'success');
    });

    /* ---------- Download / install modal ---------- */
    const appUrl = () => location.origin + location.pathname.replace(/editor\.html$/, '') + 'view.html?id=' + appId;

    $('btn-download').addEventListener('click', async () => {
      await save();
      const url = appUrl();
      $('dl-url').textContent = url;
      $('btn-open-app').href = url;
      const qr = $('qr-img');
      qr.classList.add('hidden');
      $('qr-loading').classList.remove('hidden');
      qr.onload = () => { $('qr-loading').classList.add('hidden'); qr.classList.remove('hidden'); };
      qr.onerror = () => { $('qr-loading').classList.add('hidden'); $('qr-img').classList.remove('hidden'); };
      qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=8&data=' + encodeURIComponent(url);
      $('dl-overlay').style.display = 'flex';
      $('dl-overlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    });

    $('dl-close').addEventListener('click', () => {
      $('dl-overlay').classList.remove('active');
      $('dl-overlay').style.display = 'none';
      document.body.style.overflow = '';
    });
    $('dl-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) {
        $('dl-overlay').classList.remove('active');
        $('dl-overlay').style.display = 'none';
        document.body.style.overflow = '';
      }
    });
    $('btn-copy-url').addEventListener('click', () => copyText(appUrl()));

    $('btn-preview').addEventListener('click', async () => {
      await save();
      window.open(appUrl(), '_blank');
    });

    window.addEventListener('beforeunload', (e) => {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });
  </script>
</body>
</html>
