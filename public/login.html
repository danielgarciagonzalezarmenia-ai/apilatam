<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Iniciar Sesion - API LATAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <a href="/" style="display:inline-block; margin-bottom: 24px;">
        <span class="navbar-logo" style="font-size: 20px;">API LATAM</span>
      </a>
      <h1>Bienvenido</h1>
      <p>Inicia sesion para acceder a tu dashboard y API key.</p>
      <button id="google-login" class="btn btn-google btn-lg" style="width: 100%;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continuar con Google
      </button>
      <p style="margin-top: 24px; font-size: 12px; color: var(--text-muted);">
        Al iniciar sesion aceptas nuestros <a href="terms.html" style="color: var(--text-secondary);">Terminos de Servicio</a> y <a href="privacy.html" style="color: var(--text-secondary);">Politica de Privacidad</a>.
      </p>
    </div>
  </div>

  <script type="module">
    import { loginWithGoogle, onAuthChange } from './js/auth.js';

    onAuthChange((user) => {
      if (user) {
        window.location.href = '/dashboard.html';
      }
    });

    document.getElementById('google-login').addEventListener('click', async () => {
      try {
        const btn = document.getElementById('google-login');
        btn.disabled = true;
        btn.textContent = 'Conectando...';
        await loginWithGoogle();
        window.location.href = '/dashboard.html';
      } catch (error) {
        console.error(error);
        alert('Error al iniciar sesion: ' + error.message);
        const btn = document.getElementById('google-login');
        btn.disabled = false;
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continuar con Google';
      }
    });
  </script>

</body>
</html>
